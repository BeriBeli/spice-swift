Section "Device"
    Identifier "Virtio GPU"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "kmsdev" "/dev/dri/card0"
EndSection

Section "Screen"
    Identifier "Virtio Screen"
    Device "Virtio GPU"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1280 720
    EndSubSection
EndSection
