<!doctype html><meta charset="utf-8"><title>SwiftSpice fixed region 30 FPS</title><style>html,body{margin:0;background:#000;overflow:hidden}canvas{width:100vw;height:100vh;image-rendering:auto}button{position:absolute;top:10px;left:10px;font:24px sans-serif}</style><canvas id="c" width="160" height="90"></canvas><button id="b">Start owned 180 second full-field test</button><script>let x=c.getContext('2d'),n=0,t;function draw(){let g=x.createLinearGradient(0,0,160,90);g.addColorStop(0,`hsl(${n*7%360},80%,45%)`);g.addColorStop(1,`hsl(${(n*7+120)%360},80%,65%)`);x.fillStyle=g;x.fillRect(0,0,160,90);n++;if(n>=5400)clearInterval(t)}draw();b.onclick=()=>{b.remove();document.documentElement.requestFullscreen();t=setInterval(draw,1000/30)}</script>
