name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require a version tag on its release branch
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "release tags must use vX.Y.Z or vX.Y.Z-beta.N" >&2
            exit 1
          fi

          release_branch=main
          if [[ "$tag" == *-beta.* ]]; then
            version="${tag#v}"
            release_branch="codex/beta-${version%%-beta.*}"
          fi
          git fetch origin "$release_branch" --no-tags
          tagged_commit="$(git rev-parse "${tag}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged_commit" "origin/$release_branch"; then
            echo "release tag $tag must point to a commit contained in $release_branch" >&2
            exit 1
          fi

  verify:
    name: Verify release candidate
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          flags=()
          if [[ "$version" == *-beta.* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}" \
            --title "$GITHUB_REF_NAME"
