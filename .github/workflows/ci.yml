name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftpm:
    name: Apple Silicon SwiftPM
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version

      - name: Install Metal shader toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Verify generated protocol sources
        run: swift package --allow-writing-to-package-directory generate-spice-protocol --check

      - name: Build
        run: swift build --disable-sandbox -Xswiftc -warnings-as-errors

      - name: Check SwiftSpice API compatibility
        run: ./Scripts/check-api-compatibility.sh

      - name: Test
        run: >-
          swift test --disable-sandbox
          --skip commandFailureDisablesMetalUntilTheNextStreamGeneration
          -Xswiftc -warnings-as-errors

      - name: Build Apple Silicon relocatable app
        run: ./Scripts/build-and-run.sh --package

      - name: Verify native dependency closure
        run: ./Scripts/verify-native-closure.sh
