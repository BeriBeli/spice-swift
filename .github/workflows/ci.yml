name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftpm:
    name: SwiftPM
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Report toolchain
        run: swift --version

      - name: Verify generated protocol sources
        run: swift package --allow-writing-to-package-directory generate-spice-protocol --check

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build universal relocatable app
        run: ./script/build_and_run.sh --package

      - name: Verify native dependency closure
        run: ./Scripts/verify-native-closure.sh
